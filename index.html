<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .user {
            background: #007bff;
            color: white;
            margin-left: 20%;
        }
        .bot {
            background: #28a745;
            color: white;
            margin-right: 20%;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مساعد الذكاء الاصطناعي</h1>
        <div class="chat-box" id="chatBox"></div>
        <input type="text" id="userInput" placeholder="اكتب استفسارك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const apiKey = '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'; // مفتاح API الخاص بك
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // إضافة رسالة المستخدم إلى الشات
            appendMessage('user', message);
            userInput.value = '';

            // طلب إلى OpenAI API
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo', // أو 'gpt-4' إذا كان متاحًا
                        messages: [{ role: 'user', content: message }],
                        max_tokens: 500
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content;
                    appendMessage('bot', botReply);
                } else {
                    appendMessage('bot', 'حدث خطأ، حاول مرة أخرى.');
                }
            } catch (error) {
                appendMessage('bot', 'خطأ في الاتصال بالخدمة.');
                console.error(error);
            }
        }

        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // التمرير للأسفل
        }

        // إرسال الرسالة عند الضغط على Enter
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
